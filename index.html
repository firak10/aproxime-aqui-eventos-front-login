<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aproxime Aqui - Eventos | Login</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #020617);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-effect {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.25);
        }
        .glow-effect:focus-within {
            box-shadow: 0 0 30px rgba(129, 140, 248, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Logo e Cabeçalho -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 mb-4 shadow-lg shadow-indigo-500/10">
                <i class="fa-solid fa-qrcode text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Aproxime Aqui</h1>
            <p class="text-slate-400 text-sm mt-1">Plataforma de Gestão de Acesso & Eventos</p>
        </div>

        <!-- Card de Login -->
        <div class="glass-card rounded-2xl p-8 shadow-2xl glow-effect transition-all duration-300">
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
                
                <!-- Feedback de Erro -->
                <div id="errorMessage" class="hidden p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm text-center flex items-center justify-center gap-2">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="errorText">E-mail ou senha incorretos.</span>
                </div>

                <!-- Campo E-mail / Usuário -->
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">E-mail ou Documento</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="text" id="email" required placeholder="seu@email.com" 
                            class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                    </div>
                </div>

                <!-- Campo Senha -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Senha / Chave de Acesso</label>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••" 
                            class="w-full pl-10 pr-10 py-3 bg-slate-900/60 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300">
                            <i id="eyeIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Botão de Entrar -->
                <button type="submit" id="btnSubmit" 
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transition-all duration-200 flex items-center justify-center gap-2">
                    <span>Acessar Painel</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-slate-500 mt-8">
            &copy; 2026 Digital Card / Aproxime Aqui. Todos os direitos reservados.
        </p>
    </div>

    <!-- JS de Autenticação -->
    <script>
        // URL da sua API no Render
        const API_BASE_URL = "https://aproxime-aqui-eventos-api.onrender.com";

        // Exibir/ocultar senha
        function togglePassword() {
            const passInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                passInput.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }

        // Processar Login
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const errorMessage = document.getElementById("errorMessage");
            const errorText = document.getElementById("errorText");
            const btnSubmit = document.getElementById("btnSubmit");

            // Oculta mensagens de erro prévias
            errorMessage.classList.add("hidden");

            // Estado de carregamento
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Autenticando...</span>`;

            try {
                const response = await fetch(`${API_BASE_URL}/v1/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Falha na autenticação.");
                }

                // Armazena dados de autenticação no localStorage
                localStorage.setItem("aproxime_token", data.access_token);
                localStorage.setItem("aproxime_role", data.role);
                localStorage.setItem("aproxime_company_id", data.company_id || "");
                localStorage.setItem("aproxime_company_name", data.company_name || "");

                // Redirecionamento Inteligente baseado no Role
                if (data.role === "superadmin") {
                    window.location.href = "https://superadmineventos.aproximeaqui.com.br"; 
                    // Caso esteja testando localmente, troque por: window.location.href = "superadmin.html";
                } else if (data.role === "admin") {
                    window.location.href = "https://admineventos.aproximeaqui.com.br"; 
                    // Caso esteja testando localmente, troque por: window.location.href = "admin.html";
                } else {
                    throw new Error("Perfil de acesso não reconhecido.");
                }

            } catch (err) {
                errorText.innerText = err.message;
                errorMessage.classList.remove("hidden");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<span>Acessar Painel</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
            }
        }
    </script>
</body>
</html>
